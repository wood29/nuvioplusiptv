name: Screens

# Nuvio Plus: renders new screens to pictures (NpScreensTest) when pushed to "screens", so they
# can be looked at before a release. The pictures are kept as the run's artifact.
on:
  push:
    branches: [ screens ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: vpn-android/native/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Placeholder keys
        run: |
          echo "TMDB_API_KEY=x" > local.properties
          cp local.properties local.dev.properties
      - name: Render
        run: |
          ./gradlew :app:testFullDebugUnitTest --tests '*NpScreensTest*' -PlivetvBuildNumber=1 -PlivetvVersionName=screens --stacktrace 2>&1 | tee screens.log
          exit ${PIPESTATUS[0]}
      - name: Errors
        if: failure()
        run: |
          grep -E "e: |FAILED|Exception|What went wrong" -A3 screens.log | head -80
      - name: Test failures
        if: always()
        run: |
          for f in app/build/test-results/testFullDebugUnitTest/*NpScreens*.xml; do grep -A25 "<failure" "$f" | head -60; done || true
      - name: Publish pictures to the np-screens-out branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp app/build/np-screens/*.png /tmp/out/ 2>/dev/null || true
          cd /tmp/out && ls -la
          git init -q && git checkout -q -b np-screens-out
          git config user.name "screens" && git config user.email "screens@users.noreply.github.com"
          git add -A && git commit -qm "Screens for ${GITHUB_SHA}" || exit 0
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" np-screens-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: np-screens
          path: |
            app/build/np-screens/*.png
            app/build/reports/tests/
