name: iPhone/iPad build

# Nuvio Plus: builds the iPhone/iPad app (unsigned for now; TestFlight once the Apple
# Developer account is set up) on every push to the `ios` branch.
on:
  push:
    branches: [ios]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The clean Live TV engine (iptvcore): its tests, on Linux (quick).
  core-tests:
    name: Live TV engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: touch local.properties
      - name: Test
        run: ./gradlew --no-daemon :iptvcore:jvmTest
      - name: Results
        if: always()
        run: |
          for f in iptvcore/build/test-results/jvmTest/*.xml; do grep -o '<testsuite [^>]*>' "$f"; grep -A3 '<failure' "$f" | head -40; done || true

  build:
    name: Build unsigned iPhone/iPad app
    runs-on: macos-26
    timeout-minutes: 120
    env:
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: Release
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
      # The same keys the TV app uses (Nuvio account, TMDB, Trakt).
      NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_BACKEND_URL }}
      NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_BACKEND_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Pick the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Runtime settings file
        run: touch local.properties
      - name: Live TV engine for iPhone, iPad and Apple TV
        run: ./gradlew --no-daemon :iptvcore:compileKotlinIosArm64 :iptvcore:compileKotlinTvosArm64 :iptvui:compileKotlinIosArm64
      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh
      - name: Build unsigned IPA
        run: ./scripts/build-ios-ipa.sh
      - name: Summarize
        run: |
          ipa="$(find build/ios-ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          [ -n "$ipa" ] || { echo "No IPA was produced." >&2; exit 1; }
          echo "## iPhone/iPad app built: $(basename "$ipa") ($(du -h "$ipa" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: nuvio-plus-ios-${{ github.sha }}
          path: build/ios-ipa/*.ipa
          retention-days: 14
